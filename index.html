<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lausebengel</title>
  <meta name="description" content="Lausebengel — Production & high-end editing studio." />
  <link rel="icon" href="Logos/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="Logos/favicon.png" />
  <link rel="apple-touch-icon" href="Logos/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/rebrand.css" />
</head>
<body>
  <div id="phone" data-state="off">
    <div class="phone__stage" id="stage">
      <div class="phone__device">
        <img class="phone__img" id="photo" src="phone-cut.png" alt="" draggable="false" />
        <div class="lcd" id="lcd">
          <button class="power" id="power" type="button" aria-label="Handy einschalten"></button>

          <div class="splash" id="splash" aria-hidden="true">
            <img class="splash__mark" src="assets/lausebengel-kappe-weiss.png" alt="" draggable="false" />
          </div>

          <div class="boot" id="boot">
            <canvas id="game" width="160" height="100"></canvas>
            <div class="boot__hud">
              <span id="score">SCORE 0</span>
              <span id="pct">0%</span>
            </div>
            <button class="boot__bar" id="skip" type="button" aria-label="Laden überspringen">
              <span class="boot__fill" id="fill"></span>
            </button>
          </div>

          <div class="screen" id="screen">
            <header class="status">
              <span class="status__left" id="signal"><span class="status__battery" id="battery"></span></span>
              <span class="status__center">
                <span class="status__date" id="date"></span>
                <span class="status__time"><span id="time"></span><span class="status__ampm" id="ampm"></span></span>
              </span>
              <span class="status__right">GPRS <span class="status__glyph" id="glyph"></span></span>
              <span class="status__rule" aria-hidden="true"></span>
            </header>
            <div class="body">
              <main class="home" id="home" aria-label="Apps"></main>
              <section class="app" id="app" hidden></section>
            </div>
            <footer class="label" id="label"></footer>
          </div>
        </div>
      </div>
    </div>
    <div class="frame" id="frame" aria-hidden="true">
      <img class="frame__mark" src="assets/lausebengel-logo.png" alt="" />
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
