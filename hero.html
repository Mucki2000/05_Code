<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lausebengel — Hero</title>
  <meta name="description" content="Lausebengel Edits — Hero." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ============ RESET ============ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #000;
      color: #fff;
      font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    /* ============ PAGE / HERO ============ */
    .hero {
      position: relative;
      width: 100vw;
      min-height: 100vh;
      background: #000;
      overflow: hidden;
      padding: 2.2vw 3vw 4vw;
    }

    /* ============ TOP NAV ============ */
    .nav {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      z-index: 5;
    }
    .nav__logo {
      display: block;
      height: 3.6vw;
      max-height: 64px;
      min-height: 28px;
    }
    .nav__logo img {
      height: 100%;
      width: auto;
      display: block;
    }
    .nav__links {
      display: flex;
      align-items: center;
      gap: 2.2vw;
      font-size: clamp(13px, 1.05vw, 18px);
      font-weight: 400;
      letter-spacing: 0.01em;
    }
    .nav__links a {
      opacity: 0.9;
      transition: opacity 120ms ease;
    }
    .nav__links a:hover { opacity: 1; }
    .nav__links a.is-active {
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    .nav__lang { opacity: 0.4; padding: 0 0.2em; }
    .nav__lang-link { font-size: 0.85em; opacity: 0.7; }
    .nav__caret {
      display: inline-block;
      margin-left: 0.35em;
      font-size: 0.7em;
      transform: translateY(-2px);
    }

    /* Dropdown for Projekte / Projects */
    .nav__has-menu { position: relative; display: inline-flex; align-items: center; }
    .nav__has-menu > a { cursor: pointer; }
    .nav__menu {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      background: #000;
      border: 1px solid rgba(255,255,255,0.12);
      min-width: 220px;
      padding: 8px 0;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 140ms ease;
      z-index: 20;
    }
    /* Invisible hover bridge: keeps the menu open while the cursor crosses
       the 10px visual gap between trigger and menu. */
    .nav__menu::before {
      content: '';
      position: absolute;
      top: -10px;
      left: 0;
      right: 0;
      height: 10px;
    }
    .nav__has-menu:hover .nav__menu,
    .nav__has-menu:focus-within .nav__menu {
      opacity: 1;
      pointer-events: auto;
    }
    .nav__menu a {
      display: block;
      padding: 10px 18px;
      font-size: 0.92em;
      opacity: 0.8;
      white-space: nowrap;
      letter-spacing: 0.01em;
    }
    .nav__menu a:hover { opacity: 1; background: rgba(255,255,255,0.05); }

    /* ============ BRAND LOGO ROW ============ */
    .brands {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(36px, 5vw, 100px);
      margin-top: 3vw;
    }
    .brands a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: opacity 160ms ease, transform 160ms ease;
    }
    .brands a:hover { opacity: 0.75; transform: translateY(-1px); }
    .brands img {
      width: auto;
      object-fit: contain;
      opacity: 0.95;
    }
    /* Per-logo size tweaks: each logo's PNG has different amounts of whitespace,
       so heights are tuned so the optical sizes feel matched. */
    .brands .b-universal   { height: clamp(40px, 4vw,  82px); filter: invert(1); }
    .brands .b-prime       { height: clamp(28px, 2.8vw, 56px); }
    .brands .b-koechert    { height: clamp(30px, 3.0vw, 60px); }
    .brands .b-audi        { height: clamp(50px, 5.2vw, 110px); filter: invert(1); }
    .brands .b-kleine      { height: clamp(56px, 5.4vw, 110px); mix-blend-mode: screen; }

    /* ============ CENTER VIDEO (replaces "Lolli Films" wordmark) ============ */
    /* Slot aspect (~3.3:1) is tuned to the logo region inside the source video,
       not the full 16:9 frame, so `object-fit: cover` crops away the empty
       black borders and the wordmark fills the slot like Lolli Films does. */
    .wordmark {
      position: relative;
      margin: 1vw auto 0;
      width: 62vw;
      max-width: 1400px;
      aspect-ratio: 510 / 155;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .wordmark video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .wordmark__placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
      font-size: clamp(14px, 1.1vw, 20px);
      letter-spacing: 0.4em;
      text-transform: uppercase;
      border: 1px dashed #1a1a1a;
    }

    /* ============ LOWER ROW: sticker + clown video ============ */
    .lower {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: end;
      margin-top: 3vw;
      gap: 2vw;
      min-height: 26vw;
    }

    /* Sticker: Lolli-Films-style "Check out our new project" callout.
       Replace .sticker__title text + the link to point at your real project. */
    .sticker {
      align-self: center;
      justify-self: start;
      margin-left: 6vw;
      width: clamp(220px, 19vw, 380px);
      padding: clamp(14px, 1.4vw, 28px) clamp(20px, 2vw, 40px);
      background: #000;
      border: 2px solid #fff;
      transform: rotate(-3deg);
      color: #fff;
      text-align: center;
      font-family: "Permanent Marker", "Caveat", "Inter", system-ui, sans-serif;
      line-height: 1.15;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      text-decoration: none;
      display: block;
    }
    .sticker__eyebrow {
      display: block;
      font-size: clamp(12px, 0.95vw, 18px);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: clamp(6px, 0.6vw, 12px);
    }
    .sticker__rule {
      border: 0;
      border-top: 2px solid #fff;
      margin: clamp(6px, 0.6vw, 12px) 0;
    }
    .sticker__title {
      display: block;
      font-size: clamp(18px, 1.6vw, 32px);
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .sticker__arrow {
      position: absolute;
      font-size: clamp(14px, 1.2vw, 22px);
      pointer-events: none;
      opacity: 0.9;
    }
    .sticker { position: relative; }
    .sticker__arrow.tl { top: -1.4em; left: -0.3em; }
    .sticker__arrow.tr { top: -1.4em; right: -0.3em; transform: scaleX(-1); }
    .sticker__arrow.bl { bottom: -1.4em; left: -0.3em; transform: scaleY(-1); }
    .sticker__arrow.br { bottom: -1.4em; right: -0.3em; transform: scale(-1, -1); }

    /* Clown video (right). Tilted, rounded. */
    .clown {
      justify-self: end;
      width: clamp(280px, 28vw, 560px);
      aspect-ratio: 16 / 11;
      border-radius: 8px;
      overflow: hidden;
      background: #050505;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
      transform: rotate(2deg) translateY(-1vw);
    }
    .clown video,
    .clown .clown__placeholder {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .clown__placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2a2a2a;
      font-size: clamp(11px, 0.85vw, 16px);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      border: 1px dashed #1c1c1c;
    }

    /* ============ MOBILE ============ */
    @media (max-width: 720px) {
      .hero { padding: 5vw 5vw 8vw; }
      .nav__logo { height: 32px; }
      .nav__links { gap: 14px; font-size: 12px; }
      .brands { flex-wrap: wrap; gap: 18px; margin-top: 10vw; }
      .brands img { height: 18px !important; }
      .wordmark { width: 92vw; margin-top: 12vw; aspect-ratio: 1.6 / 1; }
      .lower { grid-template-columns: 1fr; min-height: 0; margin-top: 10vw; }
      .sticker { margin-left: 0; justify-self: center; transform: rotate(-3deg); }
      .clown { justify-self: center; width: 90vw; transform: rotate(2deg); }
    }
  </style>
</head>
<body>

  <section class="hero">

    <!-- ============ TOP NAV ============ -->
    <header class="nav">
      <!-- Top-left logo: last frame of the WhatsApp video, tight-cropped. -->
      <a href="index.html" class="nav__logo" aria-label="Lausebengel">
        <img src="assets/lausebengel-logo.png" alt="Lausebengel" />
      </a>

      <nav class="nav__links" aria-label="Hauptnavigation">
        <div class="nav__has-menu">
          <a>Projekte<span class="nav__caret">▾</span></a>
          <div class="nav__menu" role="menu">
            <a href="projects.html#universal" role="menuitem">Universal</a>
            <a href="projects.html#prime"     role="menuitem">Prime Video</a>
            <a href="projects.html#koechert"  role="menuitem">A.E. Köchert</a>
            <a href="projects.html#audi"      role="menuitem">Audi Sport</a>
            <a href="projects.html#kleine"    role="menuitem">Kleine Brüder</a>
            <a href="projects.html#youtube"   role="menuitem">YouTube / Social</a>
          </div>
        </div>
        <a href="hero.html" class="is-active">Start</a>
        <a href="about.html">Über uns</a>
        <span class="nav__lang" aria-hidden="true">|</span>
        <a href="en/hero.html" class="nav__lang-link" aria-label="Switch to English">EN</a>
      </nav>
    </header>

    <!-- ============ BRAND LOGOS ============
         Each <a href="…"> points to the project page for that client.
         Replace the placeholder hrefs ("#project-…") with the real URLs.   -->
    <div class="brands" aria-label="Kunden">
      <a href="projects.html#universal" aria-label="Projekt Universal">
        <img class="b-universal" src="Logos/Universal-Logo-1997.png" alt="Universal" />
      </a>
      <a href="projects.html#prime" aria-label="Projekt Prime Video">
        <img class="b-prime"     src="Logos/prime-video-horizontal-logo-white-dec-2024.png" alt="Prime Video" />
      </a>
      <a href="projects.html#koechert" aria-label="Projekt A.E. Köchert">
        <img class="b-koechert"  src="Logos/Koechert-Logo.webp" alt="A.E. Köchert" />
      </a>
      <a href="projects.html#audi" aria-label="Projekt Audi Sport">
        <img class="b-audi"      src="Logos/Audi.png" alt="Audi Sport" />
      </a>
      <a href="projects.html#kleine" aria-label="Projekt Kleine Brüder">
        <img class="b-kleine"    src="Logos/Kleine brüder.jpg" alt="Kleine Brüder" />
      </a>
    </div>

    <!-- ============ CENTER VIDEO (the big wordmark slot) ============ -->
    <!-- Drop a file at assets/hero-video-main.mp4 and it will autoplay here. -->
    <div class="wordmark"
         data-video="assets/WhatsApp%20Video%202026-05-14%20at%2002.07.43.mp4"
         data-rate="0.85"
         data-label="Hauptvideo">
      <div class="wordmark__placeholder">Hauptvideo</div>
    </div>

  </section>

  <script>
    // For each slot with [data-video], probe the file. If it exists, swap the
    // placeholder for an autoplaying <video>.
    //
    // Per-slot options via data-attributes:
    //   data-loop="true"       → loop the video (default: false, plays once and holds last frame)
    //   data-rate="0.7"        → playback speed multiplier (default: 1.0)
    (function () {
      const slots = document.querySelectorAll('[data-video]');
      slots.forEach((slot) => {
        const src = slot.dataset.video;
        if (!src) return;
        const shouldLoop = slot.dataset.loop === 'true';
        const rate = parseFloat(slot.dataset.rate) || 1.0;

        fetch(src, { method: 'HEAD' })
          .then((res) => {
            if (!res.ok) return;
            const placeholder = slot.querySelector('.wordmark__placeholder, .clown__placeholder');
            if (placeholder) placeholder.remove();

            const v = document.createElement('video');
            v.src = src;
            v.muted = true;
            v.autoplay = true;
            v.playsInline = true;
            v.setAttribute('playsinline', '');
            v.preload = 'auto';
            if (shouldLoop) v.loop = true;

            v.addEventListener('loadedmetadata', () => { v.playbackRate = rate; });
            // Belt-and-suspenders: re-apply rate after play starts (some browsers
            // reset it on play()).
            v.addEventListener('play', () => { v.playbackRate = rate; });

            // When the video reaches the end and we're not looping, hold on the
            // very last frame (some browsers re-show the poster/empty otherwise).
            if (!shouldLoop) {
              v.addEventListener('ended', () => {
                try {
                  v.pause();
                  v.currentTime = Math.max(0, v.duration - 0.02);
                } catch (_) { /* ignore */ }
              });
            }

            slot.appendChild(v);
          })
          .catch(() => { /* keep placeholder */ });
      });
    })();
  </script>

</body>
</html>
