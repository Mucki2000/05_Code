<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Lausebengel</title>
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://lausebengel.studio/" />
  <script>
    // Old site URLs (about.html, current.html, de/, en/ ...) still float around
    // in search results: send them into the matching app of the phone.
    (function () {
      var p = location.pathname.toLowerCase();
      var to = '/';
      if (/about/.test(p)) to = '/#about';
      else if (/current/.test(p)) to = '/#current';
      else if (/project|premium|film/.test(p)) to = '/#filmtv';
      else if (/campaign|social|unternehmen/.test(p)) to = '/#unternehmen';
      else if (/contact|career/.test(p)) to = '/#contact';
      location.replace(to);
    })();
  </script>
  <meta http-equiv="refresh" content="1; url=/" />
  <style>html{background:#000;color:#c7d2d6;font:16px monospace}body{display:grid;place-items:center;height:100vh;margin:0}a{color:inherit}</style>
</head>
<body><a href="/">Lausebengel &rarr;</a></body>
</html>
