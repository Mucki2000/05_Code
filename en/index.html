<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lausebengel — Hero</title>
  <meta name="description" content="Lausebengel Edits — Hero." />

  <link rel="alternate" hreflang="de" href="../index.html" />
  <link rel="alternate" hreflang="en" href="index.html" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ============ RESET ============ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #000;
      color: #fff;
      font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    /* ============ PAGE / HERO ============ */
    .hero {
      position: relative;
      width: 100vw;
      min-height: 100vh;
      background: #000;
      overflow: hidden;
      padding: 2.2vw 3vw 4vw;
    }

    /* ============ TOP NAV ============ */
    .nav {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      z-index: 5;
    }
    .nav__logo {
      display: block;
      height: 3.6vw;
      max-height: 64px;
      min-height: 28px;
    }
    .nav__logo img {
      height: 100%;
      width: auto;
      display: block;
    }
    .nav__links {
      display: flex;
      align-items: center;
      gap: 2.2vw;
      font-size: clamp(13px, 1.05vw, 18px);
      font-weight: 400;
      letter-spacing: 0.01em;
    }
    .nav__links a {
      opacity: 0.9;
      transition: opacity 120ms ease;
    }
    .nav__links a:hover { opacity: 1; }
    .nav__links a.is-active {
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    .nav__lang { opacity: 0.4; padding: 0 0.2em; }
    .nav__lang-link { font-size: 0.85em; opacity: 0.7; }
    .nav__caret {
      display: inline-block;
      margin-left: 0.35em;
      font-size: 0.7em;
      transform: translateY(-2px);
    }

    .nav__has-menu { position: relative; display: inline-flex; align-items: center; }
    .nav__has-menu > a { cursor: pointer; }
    .nav__menu {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      background: #000;
      border: 1px solid rgba(255,255,255,0.12);
      min-width: 220px;
      padding: 8px 0;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 140ms ease;
      z-index: 20;
    }
    .nav__menu::before {
      content: '';
      position: absolute;
      top: -10px;
      left: 0;
      right: 0;
      height: 10px;
    }
    .nav__has-menu:hover .nav__menu,
    .nav__has-menu:focus-within .nav__menu {
      opacity: 1; pointer-events: auto;
    }
    .nav__menu a {
      display: block; padding: 10px 18px;
      font-size: 0.92em; opacity: 0.8;
      white-space: nowrap; letter-spacing: 0.01em;
    }
    .nav__menu a:hover { opacity: 1; background: rgba(255,255,255,0.05); }

    /* ============ BRAND LOGO ROW ============ */
    .brands {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(36px, 5vw, 100px);
      margin-top: 3vw;
    }
    .brands a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: opacity 160ms ease, transform 160ms ease;
    }
    .brands a:hover { opacity: 0.75; transform: translateY(-1px); }
    .brands img {
      width: auto;
      object-fit: contain;
      opacity: 0;
      animation: brandFade 650ms ease forwards;
    }
    @keyframes brandFade {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 0.95; transform: translateY(0); }
    }
    .brands a:nth-child(1) img { animation-delay: 100ms; }
    .brands a:nth-child(2) img { animation-delay: 200ms; }
    .brands a:nth-child(3) img { animation-delay: 300ms; }
    .brands a:nth-child(4) img { animation-delay: 400ms; }
    .brands a:nth-child(5) img { animation-delay: 500ms; }
    @media (prefers-reduced-motion: reduce) {
      .brands img { animation: none; opacity: 0.95; }
    }
    .brands .b-universal   { height: clamp(40px, 4vw,  82px); filter: invert(1); }
    .brands .b-prime       { height: clamp(28px, 2.8vw, 56px); }
    .brands .b-koechert    { height: clamp(30px, 3.0vw, 60px); }
    .brands .b-audi        { height: clamp(50px, 5.2vw, 110px); filter: invert(1); }
    .brands .b-kleine      { height: clamp(56px, 5.4vw, 110px); mix-blend-mode: screen; }

    /* ============ CENTER VIDEO ============ */
    .wordmark {
      position: relative;
      margin: 1vw auto 0;
      width: 74vw;
      max-width: 1650px;
      aspect-ratio: 510 / 155;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .wordmark video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .wordmark__placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
      font-size: clamp(14px, 1.1vw, 20px);
      letter-spacing: 0.4em;
      text-transform: uppercase;
      border: 1px dashed #1a1a1a;
    }

    /* ============ VIDEO SHOWCASE (below the hero) ============ */
    .showcase {
      width: 100%;
      max-width: 1700px;
      margin: 0 auto;
      padding: clamp(30px, 4vw, 80px) clamp(16px, 3vw, 60px) clamp(60px, 7vw, 140px);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(14px, 1.4vw, 28px);
    }
    .show-card {
      position: relative;
      display: block;
      aspect-ratio: 16 / 9;
      border-radius: clamp(8px, 0.7vw, 16px);
      overflow: hidden;
      background: #0a0a0a;
      text-decoration: none;
      color: #fff;
    }
    .show-card video,
    .show-card__placeholder {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      z-index: 1;
      transition: transform 450ms ease, filter 300ms ease;
    }
    .show-card__placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2a2a2a;
      font-size: clamp(11px, 0.85vw, 16px);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      border: 1px dashed #1c1c1c;
    }
    .show-card__label {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: flex-end;
      padding: clamp(14px, 1.4vw, 30px);
      font-size: clamp(16px, 1.4vw, 30px);
      font-weight: 500;
      letter-spacing: 0.01em;
      background: linear-gradient(to top, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0) 55%);
      opacity: 0;
      transition: opacity 260ms ease;
      pointer-events: none;
    }
    .show-card:hover .show-card__label { opacity: 1; }
    .show-card:hover video { transform: scale(1.04); filter: brightness(0.7); }

    /* ============ MOBILE ============ */
    @media (max-width: 720px) {
      .hero { padding: 5vw 5vw 8vw; }
      .nav__logo { height: 32px; }
      .nav__links { gap: 14px; font-size: 12px; }
      .brands { flex-wrap: wrap; gap: 18px; margin-top: 10vw; }
      .brands img { height: 18px !important; }
      .wordmark { width: 92vw; margin-top: 12vw; aspect-ratio: 1.6 / 1; }
      .showcase { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <section class="hero">

    <!-- ============ TOP NAV ============ -->
    <header class="nav">
      <a href="../index.html" class="nav__logo" aria-label="Lausebengel">
        <img src="../assets/lausebengel-logo.png" alt="Lausebengel" />
      </a>

      <nav class="nav__links" aria-label="Main navigation">
        <div class="nav__has-menu">
          <a>Projects<span class="nav__caret">▾</span></a>
          <div class="nav__menu" role="menu">
            <a href="projects.html#universal" role="menuitem">Universal</a>
            <a href="projects.html#prime"     role="menuitem">Prime Video</a>
            <a href="projects.html#koechert"  role="menuitem">A.E. Köchert</a>
            <a href="projects.html#audi"      role="menuitem">Audi Sport</a>
            <a href="projects.html#kleine"    role="menuitem">Kleine Brüder</a>
            <a href="projects.html#youtube"   role="menuitem">YouTube / Social</a>
          </div>
        </div>
        <a href="index.html" class="is-active">Home</a>
        <a href="about.html">About</a>
        <span class="nav__lang" aria-hidden="true">|</span>
        <a href="../index.html" class="nav__lang-link" aria-label="Auf Deutsch wechseln">DE</a>
      </nav>
    </header>

    <!-- ============ BRAND LOGOS ============
         Each <a href="…"> points to the project page for that client.
         Replace the placeholder hrefs ("#project-…") with the real URLs.   -->
    <div class="brands" aria-label="Clients">
      <a href="projects.html#universal" aria-label="Universal project">
        <img class="b-universal" src="../Logos/Universal-Logo-1997.png" alt="Universal" />
      </a>
      <a href="projects.html#prime" aria-label="Prime Video project">
        <img class="b-prime"     src="../Logos/prime-video-horizontal-logo-white-dec-2024.png" alt="Prime Video" />
      </a>
      <a href="projects.html#koechert" aria-label="A.E. Köchert project">
        <img class="b-koechert"  src="../Logos/Koechert-Logo.webp" alt="A.E. Köchert" />
      </a>
      <a href="projects.html#audi" aria-label="Audi Sport project">
        <img class="b-audi"      src="../Logos/Audi.png" alt="Audi Sport" />
      </a>
      <a href="projects.html#kleine" aria-label="Kleine Brüder project">
        <img class="b-kleine"    src="../Logos/Kleine brüder.jpg" alt="Kleine Brüder" />
      </a>
    </div>

    <!-- ============ CENTER VIDEO ============ -->
    <div class="wordmark"
         data-video="../assets/LP_Animation_4k.mp4"
         data-rate="0.85"
         data-label="Main video">
      <div class="wordmark__placeholder">Main video</div>
    </div>

  </section>

  <!-- ============ VIDEO SHOWCASE ============ -->
  <section class="showcase" aria-label="Projects">
    <a class="show-card" href="projects.html#universal"
       data-video="../assets/projects/Philippa_Kinsky_Website.mp4" data-loop="true">
      <div class="show-card__placeholder">Universal</div>
      <span class="show-card__label">Universal Music</span>
    </a>
    <a class="show-card" href="projects.html#prime"
       data-video="../assets/projects/Amazon_Prime_Website.mp4" data-loop="true">
      <div class="show-card__placeholder">Prime Video</div>
      <span class="show-card__label">Amazon Prime Video</span>
    </a>
    <a class="show-card" href="projects.html#koechert"
       data-video="../assets/projects/A.E.Koechert_Website.mp4" data-loop="true">
      <div class="show-card__placeholder">A.E. Köchert</div>
      <span class="show-card__label">A.E. Köchert</span>
    </a>
    <a class="show-card" href="projects.html#audi"
       data-video="../assets/projects/Audi_Sport_Website.mp4" data-loop="true">
      <div class="show-card__placeholder">Audi Sport</div>
      <span class="show-card__label">Audi Sport</span>
    </a>
    <a class="show-card" href="projects.html#kleine"
       data-video="../assets/projects/Michael%20Short%20%28KF%29_KLEINE_DA.mp4" data-loop="true">
      <div class="show-card__placeholder">Kleine Brüder</div>
      <span class="show-card__label">Kleine Brüder</span>
    </a>
  </section>

  <script>
    // For each slot with [data-video], probe the file. If it exists, swap the
    // placeholder for an autoplaying <video>.
    //   data-loop="true"  → loop (default false; play once + hold last frame)
    //   data-rate="0.7"   → playback speed multiplier (default 1.0)
    (function () {
      const slots = document.querySelectorAll('[data-video]');
      slots.forEach((slot) => {
        const src = slot.dataset.video;
        if (!src) return;
        const shouldLoop = slot.dataset.loop === 'true';
        const rate = parseFloat(slot.dataset.rate) || 1.0;

        fetch(src, { method: 'HEAD' })
          .then((res) => {
            if (!res.ok) return;
            const placeholder = slot.querySelector('.wordmark__placeholder, .show-card__placeholder');
            if (placeholder) placeholder.remove();

            const v = document.createElement('video');
            v.src = src;
            v.muted = true;
            v.autoplay = true;
            v.playsInline = true;
            v.setAttribute('playsinline', '');
            v.preload = 'auto';
            if (shouldLoop) v.loop = true;

            v.addEventListener('loadedmetadata', () => { v.playbackRate = rate; });
            v.addEventListener('play', () => { v.playbackRate = rate; });

            if (!shouldLoop) {
              v.addEventListener('ended', () => {
                try {
                  v.pause();
                  v.currentTime = Math.max(0, v.duration - 0.02);
                } catch (_) {}
              });
            }

            slot.appendChild(v);
          })
          .catch(() => {});
      });
    })();
  </script>

</body>
</html>
